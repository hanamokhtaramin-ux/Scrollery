<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Scrollery — PDF &amp; EPUB Autoscroll Reader</title>

    <!-- Reader fonts (optional enhancement; degrades to system serif/sans if blocked) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!--
      All libraries are vendored locally in ./vendor so the app needs NO CDN at
      runtime. Order matters: React before the app, JSZip before epub.js.
    -->
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/babel.min.js"></script>
    <script src="vendor/pdf.min.js"></script>
    <script src="vendor/jszip.min.js"></script>
    <script src="vendor/epub.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-presets="react" src="App.jsx"></script>
  </body>
</html>
